services:
  # 服務名稱同時也是容器之間的 DNS 名稱。
  # 階段 2 加入 n8n 後,n8n 會用 http://inwave:8080 找到這個服務。
  inwave:
    build: .
    container_name: inwave
    restart: unless-stopped

    # 左邊是你電腦上的埠,右邊是容器裡的埠。
    # 容器裡是 8080(Dockerfile 的 ASPNETCORE_HTTP_PORTS)。
    #
    # 對外刻意用 5121 而非 5120:5120 是 Properties/launchSettings.json 裡
    # 本機 dotnet run / F5 用的埠,兩邊都綁 5120 的話,容器只要開著就無法在
    # 本機偵錯,會噴 System.IO.IOException: Failed to bind to address
    # http://[::1]:5120: address already in use。
    #
    #   本機偵錯(F5) → http://localhost:5120
    #   容器          → http://localhost:5121
    #
    # 前面的 127.0.0.1 是刻意的:只綁在本機迴路,同網段的其他裝置連不到。
    # 不加的話 Docker 預設綁 0.0.0.0,同一個 Wi-Fi 的任何人都能打開這個站——
    # 而本站目前沒有任何認證機制,對方可以上傳照片、看全部歌單、消耗 API 配額。
    ports:
      - "127.0.0.1:5121:8080"

    environment:
      # 容器預設時區是 UTC,不設這個的話台北晚上 8 點後建立的作品
      # 日期會顯示成前一天。受影響的有三處:
      #   WorksController.cs:208 的 DateTime.Now
      #   Views/Works/Index.cshtml 的 ToLocalTime()(兩處)
      #   Views/Works/Details.cshtml:17 的 ToLocalTime()
      - TZ=Asia/Taipei

      # Production 環境下 Program.cs:17 的 if 會成立,啟用
      # UseExceptionHandler 與 UseHsts。要看詳細錯誤頁時改成 Development。
      - ASPNETCORE_ENVIRONMENT=Production

      # 讓 reloadOnChange 在掛載的金鑰檔上真的有效。
      # 預設的檔案監看走 inotify,而**掛載進容器的檔案不會傳遞 inotify 事件**
      # (Windows→Linux 的 bind mount、Kubernetes 的 Secret volume 都一樣),
      # 監看器永遠不會被觸發,換了金鑰也不會生效——實測過,確實不會。
      # 改成輪詢(約每 4 秒看一次檔案時間)就會動。成本是一個小檔案的 stat。
      - DOTNET_USE_POLLING_FILE_WATCHER=true

      # 資料庫檔案放在 /app/docker-data,由下面的 volume 掛到你的硬碟。
      # 冒號在環境變數裡要寫成雙底線:ConnectionStrings:DefaultConnection
      - ConnectionStrings__DefaultConnection=Data Source=/app/docker-data/mymusicbuddy.db

      # YouTube 金鑰。User Secrets 在容器裡不存在,改用環境變數。
      # ASP.NET Core 的組態系統本來就會讀環境變數,不需要改任何程式碼。
      # 值放在同目錄的 .env 檔(已被 .gitignore 擋住,不會進版控)。
      - YouTube__ApiKey=${YOUTUBE_API_KEY:-}

      # AI 判讀:容器之間用服務名稱互連,localhost 在容器裡指容器自己。
      # 本機 F5(5120)不吃這一段,走 appsettings.json 的 http://localhost:5678。
      - N8n__AnalyzeUrl=http://n8n:5678/webhook/inwave/analyze
      # webhook 的 Header Auth token。優先讀掛進來的 user-secrets(見下方 volumes),
      # 這裡只是沒有 user-secrets 時的退路。
      - N8n__Token=${N8N_WEBHOOK_TOKEN:-}

    volumes:
      # 容器刪掉重建時,這兩個目錄的內容要留下來。
      # 冒號左邊是你硬碟上的路徑,右邊是容器裡的路徑。
      #
      # 注意路徑不要取名 ./data —— Windows 檔案系統不分大小寫,
      # 那會撞到專案既有的 Data\ 原始碼資料夾(AppDbContext.cs 在裡面),
      # 結果是把資料庫掛進原始碼目錄。Linux 上不會發生,所以很難事後發現。
      - ./docker-data:/app/docker-data          # SQLite 資料庫
      - ./wwwroot/uploads:/app/wwwroot/uploads  # 使用者上傳的照片
      #
      # ⚠️ 容器以非 root(UID 1654)執行,所以上面這兩個目錄**與其中既有的檔案**
      #    都要讓 1654 寫得進去。若是從先前 root 版本升級上來,舊檔的擁有者是
      #    root,啟動會炸 `SQLite Error 8: attempt to write a readonly database`。
      #    一次性修正:
      #      docker run --rm -u 0 -v "${PWD}/docker-data:/x" -v "${PWD}/wwwroot/uploads:/y" \
      #        mcr.microsoft.com/dotnet/aspnet:10.0 chown -R 1654:1654 /x /y

      # 金鑰不掛在這裡。本檔是**正式部署也能直接用**的基礎設定,
      # 金鑰由環境變數(上方)或平台的 secret volume 掛到 /app/secrets 提供。
      # 開發機從 user-secrets 讀的那個掛載在 docker-compose.override.yml,
      # compose 會自動疊上去,正式部署時用 `-f docker-compose.yml` 排除它。

  # n8n:工作流自動化。階段 3 會用它跑 AI 判讀照片。
  #
  # 同一個 compose 檔裡的服務會自動加入同一個網路,彼此可用「服務名稱」互相連線:
  #   從 inwave 容器  → http://n8n:5678
  #   從 n8n 容器     → http://inwave:8080
  # 注意用的是「服務名稱 + 容器內的埠」,不是 localhost 也不是對外的 5121。
  # 容器裡的 localhost 指的是「容器自己」,不是你的電腦。
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.5
    container_name: n8n
    restart: unless-stopped

    # Tailscale serve 已設定把 desktop-cj8q9sn.tail02844b.ts.net 代理到
    # 127.0.0.1:5678,所以對外埠必須維持 5678,不能改。
    # 查目前設定:tailscale serve status
    ports:
      - "5678:5678"

    environment:
      - TZ=Asia/Taipei
      - GENERIC_TIMEZONE=Asia/Taipei

      # 產生編輯器網址與 webhook 網址用。給完整網址即可,
      # 不需要 N8N_HOST / N8N_PROTOCOL(那兩個只是用來拼出這個網址)。
      - N8N_EDITOR_BASE_URL=https://desktop-cj8q9sn.tail02844b.ts.net
      # 舊的 WEBHOOK_URL 已被 n8n 標為淘汰,日誌會警告,改用這個
      - N8N_WEBHOOK_URL=https://desktop-cj8q9sn.tail02844b.ts.net

      # 前面隔了 Tailscale serve 一層反向代理,要讓 n8n 正確判讀來源 IP
      - N8N_PROXY_HOPS=1

      # 允許讀檔節點存取 /files。
      #
      # n8n 2.x 預設 N8N_RESTRICT_FILE_ACCESS_TO='~/.n8n-files',只開放那一個
      # 資料夾;不設這個的話,讀 /files/xxx.jpg 會噴
      # "Access to the file is not allowed."
      #
      # 這是刻意的安全機制:讀檔節點若不限制,任何人在 n8n 裡建一條工作流就能讀
      # /etc/passwd 或 n8n 自己的 database.sqlite(裡面有全部 API 金鑰)。
      # 這裡只開放 /files,其餘照舊擋著;多個路徑用分號 ; 分隔。
      #
      # 另外兩道預設防線維持開啟,不要關:
      #   N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=true  禁止碰 n8n 自己的憑證資料庫
      #   N8N_BLOCK_FILE_PATTERNS='\.git'          禁止碰 .git 目錄
      - N8N_RESTRICT_FILE_ACCESS_TO=/files

    volumes:
      # 資料來源:2026-08-11 從 C:\Users\admin\source\repos\n8n0807 複製而來
      # (不是 Docker\n8n 那份 8/10 舊快照)。原資料夾保留未動,可當後路。
      - ./n8n-data:/home/node/.n8n
      - ./n8n-files:/files
